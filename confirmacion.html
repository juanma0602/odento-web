<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Confirmado · Odento</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --verde-900: #1b5e20;
            --verde-700: #2e7d32;
            --verde-500: #22c55e;
            --verde-300: #86efac;
            --verde-100: #e8f5e9;
            --ink-900: #0f172a;
            --ink-700: #1e293b;
            --ink-500: #475569;
            --sombra-card: 0 1px 2px rgba(16, 24, 40, 0.04),
                           0 8px 16px rgba(16, 24, 40, 0.06),
                           0 24px 48px -12px rgba(16, 24, 40, 0.18),
                           0 48px 80px -24px rgba(34, 197, 94, 0.15);
        }

        html, body { height: 100%; }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background:
                radial-gradient(circle at 20% 10%, rgba(134, 239, 172, 0.45), transparent 45%),
                radial-gradient(circle at 80% 90%, rgba(59, 130, 246, 0.15), transparent 50%),
                linear-gradient(135deg, #e9f5f0 0%, #d4efe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.55;
            z-index: 0;
            pointer-events: none;
        }
        body::before {
            width: 420px; height: 420px;
            background: radial-gradient(circle, #86efac 0%, transparent 70%);
            top: -120px; left: -120px;
            animation: float 14s ease-in-out infinite;
        }
        body::after {
            width: 480px; height: 480px;
            background: radial-gradient(circle, #a7f3d0 0%, transparent 70%);
            bottom: -160px; right: -140px;
            animation: float 18s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(30px, -30px) scale(1.08); }
        }

        /* ===== Card ===== */
        .card {
            position: relative;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: var(--sombra-card);
            max-width: 480px;
            width: 100%;
            padding: 44px 32px 40px;
            text-align: center;
            z-index: 1;
            animation: fadeInUp 0.7s cubic-bezier(0.22, 1, 0.36, 1);
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 140%;
            height: 180px;
            background: radial-gradient(ellipse at center, rgba(134, 239, 172, 0.4), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .card > * { position: relative; z-index: 1; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ===== Marca Odento ===== */
        .brand {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 0 auto 26px;
            padding: 8px 16px 8px 10px;
            border-radius: 100px;
            background: linear-gradient(135deg, rgba(240, 253, 244, 0.9) 0%, rgba(220, 252, 231, 0.9) 100%);
            border: 1px solid rgba(34, 197, 94, 0.22);
            box-shadow:
                0 1px 2px rgba(21, 128, 61, 0.06),
                0 8px 20px -10px rgba(21, 128, 61, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        .brand-mark {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 800;
            font-size: 18px;
            line-height: 1;
            letter-spacing: -0.04em;
            box-shadow:
                0 4px 10px -2px rgba(21, 128, 61, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.35);
            flex-shrink: 0;
        }

        .brand-mark svg {
            width: 18px;
            height: 18px;
            display: block;
        }

        .brand-logo {
            height: 32px;
            width: auto;
            display: block;
            filter: drop-shadow(0 4px 8px rgba(15, 23, 42, 0.06));
        }

        .brand-word {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #0f172a;
            line-height: 1;
            padding-right: 4px;
        }

        .brand-word .dot {
            color: var(--verde-500);
        }

        /* ===== Checkmark ===== */
        .checkmark-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 28px;
            background: linear-gradient(145deg, #e8f5e9 0%, #d1fae5 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                inset 0 2px 4px rgba(255, 255, 255, 0.9),
                inset 0 -4px 8px rgba(34, 197, 94, 0.12),
                0 12px 28px -8px rgba(34, 197, 94, 0.45);
            animation:
                scaleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s both,
                pulseGlow 2.4s ease-in-out 1s infinite;
        }

        .checkmark-container::before,
        .checkmark-container::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid rgba(34, 197, 94, 0.5);
            animation: ripple 2.4s ease-out 0.8s infinite;
            pointer-events: none;
        }
        .checkmark-container::after { animation-delay: 1.6s; }

        @keyframes scaleIn {
            0%   { transform: scale(0); opacity: 0; }
            60%  { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes pulseGlow {
            0%, 100% {
                box-shadow:
                    inset 0 2px 4px rgba(255, 255, 255, 0.9),
                    inset 0 -4px 8px rgba(34, 197, 94, 0.12),
                    0 12px 28px -8px rgba(34, 197, 94, 0.45),
                    0 0 0 0 rgba(34, 197, 94, 0.35);
            }
            50% {
                box-shadow:
                    inset 0 2px 4px rgba(255, 255, 255, 0.9),
                    inset 0 -4px 8px rgba(34, 197, 94, 0.12),
                    0 16px 36px -8px rgba(34, 197, 94, 0.55),
                    0 0 0 14px rgba(34, 197, 94, 0);
            }
        }

        @keyframes ripple {
            0%   { transform: scale(1);   opacity: 0.7; }
            100% { transform: scale(1.7); opacity: 0; }
        }

        .checkmark {
            width: 50px; height: 50px;
            position: relative;
        }

        .checkmark::before {
            content: '';
            position: absolute;
            width: 28px; height: 14px;
            border-left: 5px solid var(--verde-700);
            border-bottom: 5px solid var(--verde-700);
            border-radius: 2px;
            transform: rotate(-45deg);
            top: 12px; left: 8px;
            filter: drop-shadow(0 2px 4px rgba(46, 125, 50, 0.35));
            animation: checkDraw 0.4s cubic-bezier(0.65, 0, 0.45, 1) 0.55s both;
        }

        @keyframes checkDraw {
            from { width: 0; height: 0; opacity: 0; }
            to   { width: 28px; height: 14px; opacity: 1; }
        }

        /* ===== Tipografía ===== */
        h1 {
            color: var(--verde-900);
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8),
                         0 4px 12px rgba(27, 94, 32, 0.12);
        }

        .subtitle {
            color: var(--ink-500);
            font-size: 17px;
            font-weight: 400;
            margin-bottom: 22px;
            line-height: 1.55;
        }

        /* ===== Chip del turno ===== */
        .turno-id {
            display: inline-block;
            background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
            color: #065f46;
            padding: 10px 20px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.03em;
            margin-bottom: 32px;
            font-family: 'SF Mono', 'Cascadia Code', 'Courier New', monospace;
            word-break: break-all;
            border: 1px solid rgba(34, 197, 94, 0.35);
            box-shadow:
                0 1px 2px rgba(21, 128, 61, 0.08),
                0 8px 20px -8px rgba(21, 128, 61, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
            min-height: 40px;
            min-width: 200px;
        }

        /* ===== Info box ===== */
        .info-box {
            background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 32px;
            text-align: left;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.9),
                0 1px 2px rgba(15, 23, 42, 0.03),
                0 8px 20px -12px rgba(15, 23, 42, 0.15);
        }

        .info-box p {
            color: var(--ink-500);
            font-size: 15px;
            margin-bottom: 10px;
            line-height: 1.5;
        }
        .info-box p:last-child { margin-bottom: 0; }
        .info-box strong { color: var(--ink-700); font-weight: 600; }

        /* ===== Botón ===== */
        .btn {
            position: relative;
            display: inline-block;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            text-decoration: none;
            padding: 15px 36px;
            border-radius: 100px;
            font-weight: 600;
            font-size: 16px;
            letter-spacing: 0.01em;
            overflow: hidden;
            box-shadow:
                0 1px 2px rgba(15, 23, 42, 0.15),
                0 8px 20px -6px rgba(15, 23, 42, 0.4),
                0 20px 40px -16px rgba(15, 23, 42, 0.5);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.25s ease;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.25) 50%,
                transparent 100%
            );
            animation: shimmer 3s ease-in-out 1.2s infinite;
        }

        @keyframes shimmer {
            0%   { left: -100%; }
            50%  { left: 100%; }
            100% { left: 100%; }
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow:
                0 2px 4px rgba(15, 23, 42, 0.15),
                0 12px 28px -6px rgba(15, 23, 42, 0.45),
                0 28px 50px -18px rgba(15, 23, 42, 0.55);
        }

        .btn:active {
            transform: translateY(-1px) scale(0.99);
            transition-duration: 0.1s;
        }

        /* ===== Footer ===== */
        .footer-note {
            margin-top: 26px;
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.5;
        }

        .footer-note a {
            color: #64748b;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        .footer-note a:hover { color: var(--verde-700); }

        /* ===== Confeti ===== */
        .confetti {
            position: fixed;
            top: -20px;
            width: 10px;
            height: 14px;
            opacity: 0;
            pointer-events: none;
            z-index: 5;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0%   { opacity: 0; transform: translateY(-40px) rotate(0deg); }
            10%  { opacity: 1; }
            100% { opacity: 0; transform: translateY(105vh) rotate(720deg); }
        }

        @media (max-width: 480px) {
            .card { padding: 36px 24px 32px; border-radius: 24px; }
            h1 { font-size: 26px; }
            .checkmark-container { width: 96px; height: 96px; }
            .brand-word { font-size: 16px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-delay: 0ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="card" role="status" aria-live="polite">

        <!-- ===== Marca Odento ===== -->
        <div class="brand" aria-label="Odento">
            <!-- Logo de imagen (si existe) -->
            <img src="images/logo.png" alt="" class="brand-logo"
                 onerror="this.remove()">
            <!-- Marca siempre visible, aunque falle la imagen -->
            <span class="brand-word">Odento<span class="dot">.</span></span>
        </div>

        <!-- Checkmark animado -->
        <div class="checkmark-container" aria-hidden="true">
            <div class="checkmark"></div>
        </div>

        <h1>¡Pago Confirmado!</h1>
        <p class="subtitle">Tu turno ha sido agendado correctamente.</p>

        <!-- ID del turno -->
        <div class="turno-id" id="turnoId">Cargando...</div>

        <!-- Detalles adicionales (opcional) -->
        <div class="info-box" id="detallesTurno" style="display:none;">
            <p><strong>📅 Día y hora:</strong> <span id="detalleFecha"></span></p>
            <p><strong>👨‍⚕️ Profesional:</strong> <span id="detalleProfesional"></span></p>
            <p><strong>🏢 Clínica:</strong> <span id="detalleClinica"></span></p>
        </div>

        <a href="/" class="btn">Volver al inicio</a>

        <p class="footer-note">
            Si necesitás asistencia, comunicate al
            <a href="tel:+5493805559116">+54 9 380 555-9116</a>
        </p>
    </div>

    <script>
        // ===== Confeti =====
        function lanzarConfeti() {
            const colores = ['#22c55e', '#86efac', '#16a34a', '#bbf7d0', '#4ade80', '#facc15'];
            for (let i = 0; i < 60; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.background = colores[Math.floor(Math.random() * colores.length)];
                c.style.width = (6 + Math.random() * 8) + 'px';
                c.style.height = (8 + Math.random() * 10) + 'px';
                c.style.borderRadius = Math.random() > 0.5 ? '2px' : '50%';
                c.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
                c.style.animationDelay = (Math.random() * 0.8) + 's';
                document.body.appendChild(c);
                setTimeout(() => c.remove(), 6000);
            }
        }

        // ===== Parámetros URL (igual que el original) =====
        const params = new URLSearchParams(window.location.search);
        const appointmentId = params.get('appointment_id') || params.get('preference_id');
        const status = params.get('status') || params.get('collection_status');

        const turnoIdEl = document.getElementById('turnoId');
        const detallesBox = document.getElementById('detallesTurno');

        if (appointmentId) {
            turnoIdEl.textContent = `Turno #${appointmentId}`;
        } else {
            turnoIdEl.textContent = 'Turno confirmado';
        }

        if (status === 'approved') {
            console.log('Pago aprobado por Mercado Pago');
        }

        window.addEventListener('load', () => {
            setTimeout(lanzarConfeti, 500);
        });

        async function cargarDetallesTurno(id) {
            try {
                const SUPABASE_URL = 'https://TU_PROYECTO.supabase.co';
                const SUPABASE_ANON_KEY = 'TU_ANON_KEY';

                const res = await fetch(`${SUPABASE_URL}/rest/v1/appointments?id=eq.${id}&select=start_ts,professional_id,clinic_id`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });

                if (!res.ok) throw new Error('Error al obtener turno');
                const data = await res.json();
                if (!data.length) return;

                const turno = data[0];
                const fecha = new Date(turno.start_ts).toLocaleDateString('es-AR', {
                    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                });
                document.getElementById('detalleFecha').textContent = fecha;

                detallesBox.style.display = 'block';
            } catch (e) {
                console.error(e);
            }
        }
    </script>
</body>
</html>
