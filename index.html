<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Odento - Asistente WhatsApp para Clínicas Dentales</title>
  <meta name="description" content="Odento: Asistente de WhatsApp para clínicas dentales. Agenda turnos automáticamente, reduce no-shows con recordatorios y reconfirmación. Integración simple y sin diagnósticos.">
  
  <!-- Open Graph -->
  <meta property="og:title" content="Odento - Asistente WhatsApp para Clínicas Dentales">
  <meta property="og:description" content="Automatiza la gestión de turnos por WhatsApp, reduce el trabajo administrativo y mejora la experiencia del paciente.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://tu-dominio.com/assets/images/og-image.jpg">
  
  <!-- Preconexiones para mejorar rendimiento -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  
  <!-- CSS optimizado -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'">
  
  <!-- Tailwind CSS con versión específica -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { 
      theme:{ 
        extend:{ 
          colors:{ 
            primary:'#2563eb', 
            secondary:'#0ea5e9', 
            accent:'#06b6d4', 
            dark:'#1e293b' 
          } 
        } 
      } 
    }
  </script>
  
  <!-- CSS crítico inline, resto externalizado -->
  <style>
    /* Solo estilos críticos aquí */
    body{ font-family:'Poppins',sans-serif; scroll-behavior:smooth; overflow-x:hidden }
    .video-container{ position:relative; width:100%; height:100vh; overflow:hidden; background:#0b1b34 }
    .navbar{ background:#2563eb; box-shadow:0 4px 12px rgba(0,0,0,.1) }
    
    /* Animación inicial */
    @keyframes heroRise{
      from{ transform:translate(-50%, 18px); opacity:0 }
      to{   transform:translate(-50%, 0);    opacity:1 }
    }
    
    /* Mejoras de contraste para accesibilidad */
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
      html { scroll-behavior: auto; }
    }
  </style>
  
  <!-- CSS no crítico cargado asíncronamente -->
  <link rel="stylesheet" href="css/main.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="css/main.css"></noscript>
</head>

<body class="bg-gray-50">
  <!-- Navbar mejorado con más semántica -->
  <header>
    <nav class="navbar text-white py-4 px-6 sticky top-0 z-50" role="navigation" aria-label="Navegación principal">
      <div class="container mx-auto flex justify-between items-center">
        <a href="#" class="flex items-center" aria-label="Odento - Página de inicio">
          <div class="bg-white w-10 h-10 rounded-full flex items-center justify-center mr-3" aria-hidden="true">
            <i class="fas fa-tooth text-primary text-xl"></i>
          </div>
          <span class="text-2xl font-bold">ODENTO</span>
        </a>

        <!-- Menú escritorio -->
        <div class="desktop-nav flex space-x-8" role="menubar">
          <a href="#features" class="hover:text-blue-200 transition font-medium" role="menuitem">Funciones</a>
          <a href="#how-it-works" class="hover:text-blue-200 transition font-medium" role="menuitem">Cómo Funciona</a>
          <a href="#testimonials" class="hover:text-blue-200 transition font-medium" role="menuitem">Testimonios</a>
          <a href="#contact" class="hover:text-blue-200 transition font-medium" role="menuitem">Contacto</a>
        </div>

        <!-- Botón hamburguesa móvil -->
        <button type="button" class="hamburger" id="hamburger" aria-expanded="false" aria-controls="mobileMenu" aria-label="Abrir menú de navegación">
          <span></span><span></span><span></span>
        </button>

        <a href="#contact" class="bg-white text-primary font-bold px-6 py-2 rounded-full hover:bg-gray-100 transition hidden md:block" role="button">Solicitar Demo</a>
      </div>
    </nav>
  </header>

  <!-- Resto del contenido... -->

  <!-- Scripts optimizados -->
  <script>
    // Cargar recursos no críticos de forma diferida
    function loadNonCriticalResources() {
      // Cargar video solo cuando sea necesario
      const video = document.querySelector('.video-background');
      if (video && !video.getAttribute('data-loaded')) {
        video.setAttribute('data-loaded', 'true');
        video.load();
      }
    }

    // Cuando el DOM esté listo
    document.addEventListener('DOMContentLoaded', function() {
      // Cargar recursos no críticos después de un retraso
      setTimeout(loadNonCriticalResources, 2000);
      
      // Manejo del menú móvil
      const hamburger = document.getElementById('hamburger');
      const mobileMenu = document.getElementById('mobileMenu');
      
      function toggleMenu(forceOpen = null) {
        const open = forceOpen !== null ? forceOpen : !mobileMenu.classList.contains('active');
        mobileMenu.classList.toggle('active', open);
        hamburger.classList.toggle('active', open);
        hamburger.setAttribute('aria-expanded', String(open));
        mobileMenu.setAttribute('aria-hidden', String(!open));
        document.body.style.overflow = open ? 'hidden' : '';
        
        // Mejorar accesibilidad para lectores de pantalla
        if (open) {
          hamburger.setAttribute('aria-label', 'Cerrar menú de navegación');
          // Mover foco al primer elemento del menú
          const firstMenuItem = mobileMenu.querySelector('a');
          if (firstMenuItem) firstMenuItem.focus();
        } else {
          hamburger.setAttribute('aria-label', 'Abrir menú de navegación');
          hamburger.focus();
        }
      }
      
      hamburger.addEventListener('click', () => toggleMenu());
      document.querySelectorAll('#mobileMenu a').forEach(a => a.addEventListener('click', () => toggleMenu(false)));
      
      // Cerrar menú al presionar Escape
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && mobileMenu.classList.contains('active')) {
          toggleMenu(false);
        }
      });
      
      // Mejorar el video para autoplay
      const video = document.querySelector('.video-background');
      if (video) {
        video.muted = true;
        const playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            // Fallback para dispositivos que no permiten autoplay
            video.poster = 'assets/videos/secretaria-poster.jpg';
          });
        }
      }
    });
  </script>
</body>
</html>
