<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Confirmado · Odento</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #e9f5f0 0%, #d4efe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            max-width: 480px;
            width: 100%;
            padding: 48px 32px;
            text-align: center;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .checkmark-container {
            width: 100px;
            height: 100px;
            margin: 0 auto 24px;
            background: #e8f5e9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: scaleIn 0.4s ease-out 0.2s both;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .checkmark {
            width: 50px;
            height: 50px;
            position: relative;
        }

        .checkmark::before {
            content: '';
            position: absolute;
            width: 28px;
            height: 14px;
            border-left: 5px solid #2e7d32;
            border-bottom: 5px solid #2e7d32;
            transform: rotate(-45deg);
            top: 12px;
            left: 8px;
            animation: checkDraw 0.3s ease-out 0.6s both;
        }

        @keyframes checkDraw {
            from {
                width: 0;
                height: 0;
            }
            to {
                width: 28px;
                height: 14px;
            }
        }

        .logo {
            width: 120px;
            margin-bottom: 24px;
        }

        h1 {
            color: #1b5e20;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #4a5568;
            font-size: 18px;
            font-weight: 400;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .turno-id {
            display: inline-block;
            background: #f0fdf4;
            color: #15803d;
            padding: 8px 16px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 32px;
            font-family: 'SF Mono', 'Cascadia Code', monospace;
            word-break: break-all;
        }

        .info-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 32px;
            text-align: left;
        }

        .info-box p {
            color: #475569;
            font-size: 15px;
            margin-bottom: 8px;
        }

        .info-box strong {
            color: #1e293b;
        }

        .btn {
            display: inline-block;
            background: #0f172a;
            color: white;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 100px;
            font-weight: 600;
            font-size: 16px;
            transition: background 0.2s, transform 0.2s;
        }

        .btn:hover {
            background: #1e293b;
            transform: translateY(-1px);
        }

        .footer-note {
            margin-top: 24px;
            color: #94a3b8;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Logo de Odento -->
        <img src="images/logo.png" alt="Odento" class="logo" onerror="this.style.display='none'">

        <!-- Checkmark animado -->
        <div class="checkmark-container">
            <div class="checkmark"></div>
        </div>

        <h1>¡Pago Confirmado!</h1>
        <p class="subtitle">Tu turno ha sido agendado correctamente.</p>

        <!-- ID del turno (se extrae de la URL) -->
        <div class="turno-id" id="turnoId">Cargando...</div>

        <!-- Detalles adicionales (opcional, se pueden cargar vía JS si se desea) -->
        <div class="info-box" id="detallesTurno" style="display:none;">
            <p><strong>📅 Día y hora:</strong> <span id="detalleFecha"></span></p>
            <p><strong>👨‍⚕️ Profesional:</strong> <span id="detalleProfesional"></span></p>
            <p><strong>🏢 Clínica:</strong> <span id="detalleClinica"></span></p>
        </div>

        <!-- Botón de regreso al inicio -->
        <a href="/" class="btn">Volver al inicio</a>

        <p class="footer-note">Si necesitás asistencia, comunicate al +54 9 380 555-9116</p>
    </div>

    <script>
        // Extraer parámetros de la URL
        const params = new URLSearchParams(window.location.search);
        const appointmentId = params.get('appointment_id') || params.get('preference_id');
        const status = params.get('status') || params.get('collection_status');

        const turnoIdEl = document.getElementById('turnoId');
        const detallesBox = document.getElementById('detallesTurno');

        if (appointmentId) {
            turnoIdEl.textContent = `Turno #${appointmentId}`;
            
            // Opcional: si querés cargar más datos desde Supabase, descomentá esta sección
            // y configurá las credenciales anónimas de Supabase.
            /*
            cargarDetallesTurno(appointmentId);
            */
        } else {
            turnoIdEl.textContent = 'Turno confirmado';
        }

        // Marcar como exitoso si el estado es "approved"
        if (status === 'approved') {
            console.log('Pago aprobado por Mercado Pago');
        }

        // Función opcional para cargar detalles del turno desde Supabase
        async function cargarDetallesTurno(id) {
            try {
                const SUPABASE_URL = 'https://TU_PROYECTO.supabase.co';
                const SUPABASE_ANON_KEY = 'TU_ANON_KEY';
                
                const res = await fetch(`${SUPABASE_URL}/rest/v1/appointments?id=eq.${id}&select=start_ts,professional_id,clinic_id`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });
                
                if (!res.ok) throw new Error('Error al obtener turno');
                const data = await res.json();
                if (!data.length) return;
                
                const turno = data[0];
                const fecha = new Date(turno.start_ts).toLocaleDateString('es-AR', {
                    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                });
                document.getElementById('detalleFecha').textContent = fecha;
                
                // Obtener profesional y clínica
                // ... más fetchs ...
                
                detallesBox.style.display = 'block';
            } catch (e) {
                console.error(e);
            }
        }
    </script>
</body>
</html>
